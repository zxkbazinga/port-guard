name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 GitHub Release 并上传附件
  packages: write   # 推送镜像到 GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 结果: zxkbazinga/port-guard

jobs:
  # ---------------------------------------------------------------
  # 1. 构建 GitHub Release 附件：爱快 Docker 应用 ipkg + 独立二进制
  # ---------------------------------------------------------------
  release-assets:
    name: 构建 ipkg 与二进制
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 解析版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 运行测试
        run: go test ./...

      - name: 交叉编译 Linux 二进制
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/zxkbazinga/port-guard/internal/version.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/port-guard-linux-amd64 ./cmd/port-guard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/port-guard-linux-arm64 ./cmd/port-guard

      - name: 打包爱快 ipkg 应用
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh scripts/build-ipkg.sh "$VERSION" dist/port-guard-linux-amd64 dist/port-guard-linux-arm64 dist
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. 构建并推送多架构 Docker 镜像到 GHCR
  # ---------------------------------------------------------------
  docker-image:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. 创建 GitHub Release，附上 ipkg 与二进制
  # ---------------------------------------------------------------
  publish-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [release-assets, docker-image]
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: 生成 Release 说明
        run: |
          VERSION="${{ needs.release-assets.outputs.version }}"
          cat > release-notes.md <<EOF
          ## Port Guard v${VERSION}

          ### Docker 镜像（GHCR）
          \`\`\`bash
          docker pull ghcr.io/zxkbazinga/port-guard:${VERSION}
          \`\`\`
          支持 linux/amd64 与 linux/arm64。

          ### 爱快应用市场（Docker 应用）
          前提：已安装并启用爱快 Docker 插件。下载 \`port-guard-${VERSION}-ikuai.ipkg\`，在爱快「扩展服务 → 应用市场 → 本地安装」上传即可。
          安装后会自动从 ghcr.io 拉取镜像并创建容器；请在应用配置页填写爱快管理地址、API 账号密码等信息。

          ### 独立二进制（可自行部署到 Linux 主机）
          - \`port-guard-linux-amd64\`
          - \`port-guard-linux-arm64\`

          详细文档见 [README](https://github.com/zxkbazinga/port-guard#readme)。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.ipkg
            dist/port-guard-linux-amd64
            dist/port-guard-linux-arm64
          generate_release_notes: true
          overwrite_files: true
