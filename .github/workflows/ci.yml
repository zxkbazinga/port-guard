name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 测试与构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 运行测试
        run: go test -v -race ./...

      - name: 交叉编译检查（amd64）
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/port-guard-amd64 ./cmd/port-guard

      - name: 交叉编译检查（arm64）
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/port-guard-arm64 ./cmd/port-guard

      - name: 校验 ipkg 包配置
        run: |
          sh -n scripts/build-ipkg.sh
          test -f ikuai-support/port-guard/app/docker-compose.yaml
          python3 -c "
          import json
          m = json.load(open('ikuai-support/port-guard/manifest.json'))
          assert m['type'] == '1', 'manifest type 必须为 Docker 应用 1'
          assert m.get('image', '').startswith('ghcr.io/'), '缺少 GHCR image 字段'
          opts = json.load(open('ikuai-support/port-guard/app/option.json'))
          assert all(o['scope'] in ('config', 'environment') for o in opts)
          assert all(o['type'] in ('string', 'integer') for o in opts)
          print(f'Docker 应用配置校验通过，共 {len(opts)} 项配置')
          "
          grep -q 'image: ghcr.io/zxkbazinga/port-guard:' ikuai-support/port-guard/app/docker-compose.yaml
