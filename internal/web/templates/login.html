{{define "login.html"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Port Guard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">◈</div>
  <h1>Port Guard</h1>
  <p class="subtitle">爱快端口映射防护系统</p>
  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <label>用户名<input name="username" autocomplete="username" required autofocus></label>
    <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">登录</button>
  </form>
  <p class="hint">默认账号 admin / portguard，登录后请尽快修改密码</p>
</div>
</body>
</html>{{end}}
